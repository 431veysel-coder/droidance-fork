jobs:
  # ----------------------------
  # 1. Static Analysis # 1. KOD KALİTESİ VE STATİK ANALİZ Lint
  # ----------------------------
  static-analysis:
    name: Static Analysis & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27b
          build-tools: 35.0.0
          cmake-version: 3.22.1

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run Detekt (Kotlin static analysis)
        run: ./gradlew detekt --no-daemon

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Verify Architecture (ArchUnit)
        run: ./gradlew verifyArchitecture --no-daemon

      - name: Verify Source & Native Inputs
        run: |
          python3 scripts/verify_source.py
          python3 scripts/verify_native.py
          python3 scripts/verify_secrets.py

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # ----------------------------
  # 2. Unit Tests (Robolectric)
  # ----------------------------
  unit-tests:
    name: Unit Tests (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27b

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html

      - name: Upload Coverage (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/build/reports/jacoco/**/*.html"

  # ----------------------------
  # 3. Instrumented Tests (Emulator)
  # ----------------------------
  instrumented-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27b
          build-tools: 35.0.0
          emulator: true
          system-image: google_apis_arm64
          cache-key: android-sdk-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Start Emulator (API 35, ARM64)
        uses: android-actions/start-emulator@v3
        with:
          api-level: 35
          arch: arm64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096 -cores 4
          ram-size: 4096M

      - name: Wait for Emulator Boot
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Instrumented Tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --continue

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            **/build/outputs/androidTest-results/**/*.xml
            **/build/reports/androidTests/**/*.html

  # ----------------------------
  # 4. Build Debug APK
  # ----------------------------
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [static-analysis, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27b

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify Packaged Native Inputs
        run: python3 scripts/verify_native.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "app/build/outputs/apk/debug/app-debug.apk"
          retention-days: 30

  # ----------------------------
  # 5. Release APK Build (Tag Push)
  # ----------------------------
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [static-analysis, unit-tests, instrumented-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27b

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify Release APK
        run: |
          python3 scripts/verify_native.py app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/verify_source.py

      - name: Sign APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > /tmp/release.jks
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED_APK=app/build/outputs/apk/release/app-release-signed.apk
          apksigner sign --ks /tmp/release.jks --ks-key-alias "${SIGNING_ALIAS}" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out "${SIGNED_APK}" "${APK}"
          apksigner verify "${SIGNED_APK}"

      - name: Generate SHA256
        run: |
          sha256sum app/build/outputs/apk/release/app-release-signed.apk > app-release-signed.apk.sha256
          cat app-release-signed.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        with:
          files: |
            app/build/outputs/apk/release/app-release-signed.apk
            app-release-signed.apk.sha256
          draft: true
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true

  # ----------------------------
  # 6. Termux Bootstrap Validation
  # ----------------------------
  termux-validation:
    name: Termux Bootstrap Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Verify Termux Bootstrap
        run: |
          set -euo pipefail
          BOOTSTRAP_URL="https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip"
          wget -q "$BOOTSTRAP_URL" -O termux-bootstrap.zip
          unzip -l termux-bootstrap.zip | head -30
          # Critical files check
          unzip -p termux-bootstrap.zip SYMLINKS.txt | head -5
          unzip -p termux-bootstrap.zip bin/bash > /dev/null && echo "bash OK"
          unzip -p termux-bootstrap.zip lib/libc.so > /dev/null && echo "libc OK"
          unzip -p termux-bootstrap.zip bin/apt > /dev/null && echo "apt OK"
          # SHA256
          sha256sum termux-bootstrap.zip > termux-bootstrap.sha256
          cat termux-bootstrap.sha256

      - name: Upload Bootstrap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-bootstrap
          path: "termux-bootstrap.zip"
          retention-days: 7

  # ----------------------------
  # 7. Dependency Review
  # ----------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review Dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # ----------------------------
  # 8. Security Scan (Trivy)
  # ----------------------------
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
